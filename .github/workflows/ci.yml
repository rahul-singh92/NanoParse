name: NanoParse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_source:
        description: "Model to evaluate"
        required: true
        type: choice
        options:
          - trained
          - untrained
        default: trained

permissions:
  contents: read

jobs:
  lint:
    name: 1. Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: |
          python -m compileall -q service tools training worker tests
          ruff check --select E9,F63,F7,F82 service tools training worker tests

  unit-tests:
    name: 2. Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  evaluation:
    name: 3. Model evaluation and quality gate
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.22.1 tokenizers==0.23.3 safetensors

      - name: Download and verify model release
        run: |
          curl -fL \
            https://github.com/rahul-singh92/NanoParse/releases/download/v1.0/pythia-70m-v1.tar.gz \
            -o model.tar.gz

          echo "3b098817b3ab49b30b44cd2b6086b71b1ef7645542451883d54dfcfebab47bfe  model.tar.gz" \
            | sha256sum -c -

          mkdir -p /tmp/nanoparse-model
          tar -xzf model.tar.gz -C /tmp/nanoparse-model

      - name: Generate validation predictions
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          ARGS=()
          if [ "${{ github.event.inputs.model_source }}" = "untrained" ]; then
            ARGS+=(--random-init)
          fi

          python tools/predict.py \
            --model-dir /tmp/nanoparse-model \
            --output results/ci_predictions.jsonl \
            "${ARGS[@]}"

      - name: Enforce 95% JSON validity
        run: |
          python tools/score.py \
            results/ci_predictions.jsonl \
            data/validation.jsonl \
            --out results/ci_score.json \
            --min-validity 95

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanoparse-evaluation
          path: |
            results/ci_predictions.jsonl
            results/ci_score.json
          if-no-files-found: warn

  secret-scan:
    name: 4. Secret scan
    needs: evaluation
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
