# Model
model_name: "EleutherAI/pythia-70m"

# Dataset
train_file: "datasets/v1/train.jsonl"
max_train_samples: 1500

# Reproducibility
seed: 42

# Training hyperparameters
learning_rate: 0.00005
batch_size: 4
epochs: 3
max_seq_length: 256
weight_decay: 0.01

# Execution
device: "cpu"

# Library versions (installed in the current virtual environment)
library_versions:
  python: "3.14"
  torch: "2.15.0"
  transformers: "5.22.1"
  tokenizers: "0.23.3"
  pyyaml: "6.0.3"
  accelerate: "1.15.0"