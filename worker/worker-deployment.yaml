apiVersion: apps/v1
kind: Deployment
metadata:
  name: teacher-worker-0
  namespace: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teacher-worker-0
  template:
    metadata:
      labels:
        app: teacher-worker-0
    spec:
      containers:
        - name: teacher
          image: nanoparse-teacher:v1
          imagePullPolicy: Never
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: OLLAMA_URL
              value: "http://10.154.12.243:11434/api/generate"
            - name: S3_URL
              value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teacher-worker-1
  namespace: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teacher-worker-1
  template:
    metadata:
      labels:
        app: teacher-worker-1
    spec:
      containers:
        - name: teacher
          image: nanoparse-teacher:v1
          imagePullPolicy: Never
          env:
            - name: SHARD_INDEX
              value: "1"
            - name: SHARD_COUNT
              value: "2"
            - name: OLLAMA_URL
              value: "http://10.154.12.243:11434/api/generate"
            - name: S3_URL
              value: "http://seaweedfs-s3.data.svc.cluster.local:8333"